
name: Sync with upstream

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork
        run: |
          gh repo sync "$FORK" \
            --source "$UPSTREAM" \
            --branch main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORK: ${{ github.repository }}
          UPSTREAM: scheduletorytold/photocraft
